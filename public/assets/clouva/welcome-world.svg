<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-label="Universo CLOUVA">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#010104"/><stop offset=".34" stop-color="#090016"/><stop offset=".7" stop-color="#050008"/><stop offset="1" stop-color="#010103"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="35%" r="48%">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".14" stop-color="#d8b2ff" stop-opacity=".32"/><stop offset=".42" stop-color="#8b31ff" stop-opacity=".19"/><stop offset="1" stop-color="#4d00aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06030b"/><stop offset="1" stop-color="#160421"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#281044" stop-opacity=".7"/><stop offset=".5" stop-color="#12051d" stop-opacity=".4"/><stop offset="1" stop-color="#020204" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="35"/></filter>
    <pattern id="windows" width="26" height="24" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="3" height="6" rx="1" fill="#9d5bff" opacity=".4"/><rect x="15" y="9" width="4" height="5" rx="1" fill="#c8a2ff" opacity=".22"/></pattern>
  </defs>

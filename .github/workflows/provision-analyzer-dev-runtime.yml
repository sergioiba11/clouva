name: Provision Analyzer Dev Runtime

on:
  push:
    branches:
      - workspace-official-v1
    paths:
      - ".github/workflows/provision-analyzer-dev-runtime.yml"
      - "analyzer/dev-runtime/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175
  REGION: us-central1
  SERVICE: clouva-analyzer-dev
  IMAGE: us-central1-docker.pkg.dev/gen-lang-client-0737053175/clouva/clouva-analyzer-dev:runtime-v1

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace-official-v1

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build generic dev runtime image
        run: |
          set -euo pipefail
          BUILD_ID="$(gcloud builds submit analyzer/dev-runtime \
            --project "$PROJECT_ID" \
            --tag "$IMAGE" \
            --async \
            --format='value(id)')"
          echo "Cloud Build: $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --format='value(status)')"
            echo "Build status: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            sleep 10
          done

      - name: Deploy persistent self-syncing runtime
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --allow-unauthenticated \
            --execution-environment gen2 \
            --cpu 2 \
            --memory 4Gi \
            --concurrency 1 \
            --timeout 900 \
            --min-instances 1 \
            --max-instances 1 \
            --no-cpu-throttling \
            --set-env-vars "REPO_URL=https://github.com/sergioiba11/clouva.git,BRANCH=workspace-official-v1,LAB_PATH=analyzer/anatomy-lab,SYNC_SECONDS=10" \
            --quiet

      - name: Verify dev runtime
        id: runtime
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Waiting for $url"
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --connect-timeout 5 "$url/health" >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              curl --fail --silent --show-error --connect-timeout 5 "$url/" >/dev/null
              echo "Runtime OK: $url"
              exit 0
            fi
            sleep 10
          done
          echo "Analyzer dev runtime did not become healthy" >&2
          exit 1

      - name: Summary
        env:
          RUNTIME_URL: ${{ steps.runtime.outputs.url }}
        run: |
          echo "### CLOUVA Analyzer Dev Runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime: $RUNTIME_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: workspace-official-v1 / analyzer/anatomy-lab" >> "$GITHUB_STEP_SUMMARY"
          echo "Analyzer source syncs every 10 seconds. Editing Analyzer code no longer rebuilds or redeploys this service." >> "$GITHUB_STEP_SUMMARY"

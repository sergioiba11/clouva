name: Diagnose Cloud Run secret IAM

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-gcp-secret-access.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: gen-lang-client-0737053175
      REGION: us-central1
      SERVICE: clouva-web
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect runtime service account and secret IAM
        shell: bash
        run: |
          set -u
          runtime_sa="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(spec.template.spec.serviceAccountName)')"

          echo "RUNTIME_SERVICE_ACCOUNT=$runtime_sa"
          echo "EXPECTED_MEMBER=serviceAccount:$runtime_sa"
          echo

          echo "=== Project-level IAM bindings for runtime SA ==="
          gcloud projects get-iam-policy "$PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter="bindings.members:serviceAccount:$runtime_sa" \
            --format='table(bindings.role,bindings.members)' || true
          echo

          for secret in SPOTIFY_CLIENT_SECRET SPOTIFY_TOKEN_ENCRYPTION_KEY; do
            echo "=== Secret: $secret ==="
            echo "-- describe --"
            gcloud secrets describe "$secret" \
              --project "$PROJECT_ID" \
              --format='yaml(name,replication,createTime)' || true
            echo "-- secret-level IAM bindings for runtime SA --"
            gcloud secrets get-iam-policy "$secret" \
              --project "$PROJECT_ID" \
              --flatten='bindings[].members' \
              --filter="bindings.members:serviceAccount:$runtime_sa" \
              --format='table(bindings.role,bindings.members,bindings.condition)' || true
            echo
          done

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context='gcp/secret-iam-diagnostic' \
            -f description='Secret IAM diagnostic completed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

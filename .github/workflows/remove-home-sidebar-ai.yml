name: Remove isolated Home sidebar AI card

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/remove-home-sidebar-ai.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove bottom-left CLOUVA AI card from Home sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("components/clouva/HomeDashboard.tsx")
          text = path.read_text(encoding="utf-8")
          marker = '<button type="button" className={styles.aiStatus} onClick={() => openAssistant()}>'
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Expected isolated Home sidebar AI card was not found")
          line_start = text.rfind("\n", 0, start) + 1
          end = text.find("</button>", start)
          if end < 0:
              raise SystemExit("Sidebar AI card closing tag was not found")
          end = text.find("\n", end)
          if end < 0:
              end = len(text)
          else:
              end += 1
          path.write_text(text[:line_start] + text[end:], encoding="utf-8")
          PY

      - name: Commit definitive removal
        run: |
          rm .github/workflows/remove-home-sidebar-ai.yml
          git config user.name "Clouva"
          git config user.email "sergio.iba.11@gmail.com"
          git add components/clouva/HomeDashboard.tsx .github/workflows/remove-home-sidebar-ai.yml
          git commit -m "fix(home): remove isolated sidebar CLOUVA AI card"
          git push origin main

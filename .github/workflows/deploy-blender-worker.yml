name: Deploy Avatar Analyzer Blender worker

on:
  push:
    branches:
      - main
      - codex/avatar-analyzer-v41-real-run-followup
    paths:
      - "worker/garment-rig/**"
      - ".github/workflows/deploy-blender-worker.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-blender-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy clouva-blender-worker to Cloud Run
        env:
          DEPLOYED_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          gcloud run deploy clouva-blender-worker \
            --project gen-lang-client-0737053175 \
            --region us-central1 \
            --source worker/garment-rig \
            --command python3 \
            --args=-m,uvicorn,runtime_app:app,--host,0.0.0.0,--port,8000 \
            --update-env-vars "CLOUVA_DEPLOYED_COMMIT=$DEPLOYED_COMMIT,CLOUVA_DEPLOYED_REF=$SOURCE_REF" \
            --quiet

      - name: Resolve deployed revision
        id: deployed
        run: |
          service_url="$(gcloud run services describe clouva-blender-worker \
            --project gen-lang-client-0737053175 \
            --region us-central1 \
            --format='value(status.url)')"
          revision="$(gcloud run services describe clouva-blender-worker \
            --project gen-lang-client-0737053175 \
            --region us-central1 \
            --format='value(status.latestReadyRevisionName)')"
          test -n "$service_url"
          test -n "$revision"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Verify Avatar Analyzer health and deployed SHA
        env:
          SERVICE_URL: ${{ steps.deployed.outputs.service_url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_REVISION: ${{ steps.deployed.outputs.revision }}
        run: |
          response="$(curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$SERVICE_URL/diagnostics/avatar-analyzer-v4")"
          RESPONSE="$response" python - "$EXPECTED_SHA" "$EXPECTED_REVISION" <<'PY'
          import json
          import os
          import sys

          expected_sha, expected_revision = sys.argv[1:3]
          data = json.loads(os.environ["RESPONSE"])
          assert data.get("ok") is True, data
          assert data.get("sourceCommit") == expected_sha, (data.get("sourceCommit"), expected_sha)
          assert data.get("revision") == expected_revision, (data.get("revision"), expected_revision)
          print(json.dumps(data, indent=2))
          PY
          printf '%s' "$response" > worker-health.json

      - name: Build deployment evidence
        env:
          SERVICE_URL: ${{ steps.deployed.outputs.service_url }}
          REVISION: ${{ steps.deployed.outputs.revision }}
          DEPLOYED_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status = {
              "service": "clouva-blender-worker",
              "project": "gen-lang-client-0737053175",
              "region": "us-central1",
              "url": os.environ["SERVICE_URL"],
              "revision": os.environ["REVISION"],
              "sourceCommit": os.environ["DEPLOYED_COMMIT"],
              "sourceRef": os.environ.get("SOURCE_REF"),
              "healthEndpoint": "/diagnostics/avatar-analyzer-v4",
              "healthVerified": True,
              "deployedAt": datetime.now(timezone.utc).isoformat(),
          }
          Path("deployment-status.json").write_text(
              json.dumps(status, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: blender-worker-deployment-${{ steps.deployed.outputs.revision }}
          path: |
            deployment-status.json
            worker-health.json
          if-no-files-found: error
          retention-days: 30

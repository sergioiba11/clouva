name: Deploy Avatar Analyzer Blender worker

on:
  push:
    branches:
      - main
      - codex/avatar-analyzer-v41-real-run-followup
    paths:
      - "worker/garment-rig/**"
      - ".github/workflows/deploy-blender-worker.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to deploy
        required: true
        default: main
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-blender-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy clouva-blender-worker to Cloud Run
        run: |
          gcloud run deploy clouva-blender-worker \
            --project gen-lang-client-0737053175 \
            --region us-central1 \
            --source worker/garment-rig \
            --quiet

      - name: Resolve deployed revision
        id: deployed
        run: |
          service_url="$(gcloud run services describe clouva-blender-worker \
            --project gen-lang-client-0737053175 \
            --region us-central1 \
            --format='value(status.url)')"
          revision="$(gcloud run services describe clouva-blender-worker \
            --project gen-lang-client-0737053175 \
            --region us-central1 \
            --format='value(status.latestReadyRevisionName)')"
          test -n "$service_url"
          test -n "$revision"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Verify Avatar Analyzer health
        env:
          SERVICE_URL: ${{ steps.deployed.outputs.service_url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          response="$(curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$SERVICE_URL/diagnostics/avatar-analyzer-v4")"
          printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); assert data; print(json.dumps(data, indent=2))'
          printf '%s' "$response" > worker-health.json

      - name: Record deployment status
        env:
          SERVICE_URL: ${{ steps.deployed.outputs.service_url }}
          REVISION: ${{ steps.deployed.outputs.revision }}
          DEPLOYED_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status = {
              "service": "clouva-blender-worker",
              "project": "gen-lang-client-0737053175",
              "region": "us-central1",
              "url": os.environ["SERVICE_URL"],
              "revision": os.environ["REVISION"],
              "sourceCommit": os.environ["DEPLOYED_COMMIT"],
              "healthEndpoint": "/diagnostics/avatar-analyzer-v4",
              "healthVerified": True,
              "deployedAt": datetime.now(timezone.utc).isoformat(),
          }
          Path("worker/garment-rig/deployment-status.json").write_text(
              json.dumps(status, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/garment-rig/deployment-status.json
          git diff --cached --quiet || git commit -m "chore: record Blender Worker deployment [skip ci]"
          git push origin HEAD:"$SOURCE_REF"

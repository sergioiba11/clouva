name: Ratcraft rollback 2026-09-23

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ratcraft-rollback-20260923.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175
  MC_ZONE: southamerica-east1-b
  MC_INSTANCE: clouva-minecraft
  TARGET_UTC: "2026-09-23T21:40:00Z"

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Roll back destroyed blocks since target time
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ratcraft-rollback.sh <<'REMOTE'
          set -euo pipefail
          echo "===== RATCRAFT ROLLBACK PREFLIGHT ====="
          sudo docker ps --filter name=clouva-minecraft
          plugins="$(sudo docker exec clouva-minecraft rcon-cli plugins 2>&1 || true)"
          echo "$plugins"

          if echo "$plugins" | grep -qi 'CoreProtect'; then
            now="$(date -u +%s)"
            target="$(date -u -d '2026-09-23T21:40:00Z' +%s)"
            seconds="$((now-target))"
            if [ "$seconds" -lt 1 ]; then
              echo "Invalid rollback window."
              exit 2
            fi

            echo "COREPROTECT_FOUND window=${seconds}s target=2026-09-23T21:40:00Z"
            echo "===== BREAK SUMMARY ====="
            sudo docker exec clouva-minecraft rcon-cli "co lookup t:${seconds}s r:#global a:-block #summary" || true
            echo "===== APPLYING ROLLBACK ====="
            sudo docker exec clouva-minecraft rcon-cli "co rollback t:${seconds}s r:#global a:-block"
            sudo docker exec clouva-minecraft rcon-cli "save-all"
            echo "RATCRAFT_ROLLBACK_APPLIED"
          else
            echo "COREPROTECT_NOT_AVAILABLE"
            echo "===== RECOVERY DIRECTORIES ====="
            sudo find /srv/minecraft/recovery -maxdepth 2 -mindepth 1 -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort -r | head -n 80 || true
            echo "===== AXIOM / UNDO DATA ====="
            sudo find /srv/minecraft/plugins -maxdepth 4 \( -iname '*axiom*' -o -iname '*undo*' -o -iname '*history*' -o -iname '*backup*' \) -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort -r | head -n 120 || true
            echo "===== WORLD FILE RECENT MTIMES ====="
            sudo find /srv/minecraft -maxdepth 2 -type f -mmin -120 -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort -r | head -n 120 || true
            exit 3
          fi
          REMOTE

          gcloud compute scp /tmp/ratcraft-rollback.sh "$MC_INSTANCE:/tmp/ratcraft-rollback.sh"             --project "$PROJECT_ID"             --zone "$MC_ZONE"             --quiet             --ssh-key-expire-after=10m

          gcloud compute ssh "$MC_INSTANCE"             --project "$PROJECT_ID"             --zone "$MC_ZONE"             --quiet             --ssh-flag="-o StrictHostKeyChecking=no"             --ssh-flag="-o UserKnownHostsFile=/dev/null"             --command='bash /tmp/ratcraft-rollback.sh'

name: Secure Ratcraft Access

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/secure-ratcraft.yml"
      - "infra/minecraft/startup.sh"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ratcraft-security
  cancel-in-progress: false

env:
  PROJECT_ID: gen-lang-client-0737053175

jobs:
  secure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Discover the live Ratcraft VM
        id: mc
        shell: bash
        run: |
          set -euo pipefail

          found="$(
            gcloud compute instances list               --project "$PROJECT_ID"               --filter='name=clouva-minecraft'               --format='csv[no-heading](name,zone.basename(),status,networkInterfaces[0].accessConfigs[0].natIP)'               | head -n 1
          )"

          if [ -z "$found" ]; then
            found="$(
              gcloud compute instances list                 --project "$PROJECT_ID"                 --filter='(name~minecraft OR name~ratcraft)'                 --format='csv[no-heading](name,zone.basename(),status,networkInterfaces[0].accessConfigs[0].natIP)'                 | head -n 1
            )"
          fi

          if [ -z "$found" ]; then
            echo "::error::No Minecraft/Ratcraft VM was found."
            exit 1
          fi

          IFS=',' read -r name zone status ip <<< "$found"

          if [ "$status" != "RUNNING" ]; then
            echo "Ratcraft VM is $status; starting $name..."
            gcloud compute instances start "$name"               --project "$PROJECT_ID"               --zone "$zone"               --quiet

            for attempt in $(seq 1 48); do
              status="$(gcloud compute instances describe "$name" --project "$PROJECT_ID" --zone "$zone" --format='value(status)')"
              ip="$(gcloud compute instances describe "$name" --project "$PROJECT_ID" --zone "$zone" --format='value(networkInterfaces[0].accessConfigs[0].natIP)')"
              [ "$status" = "RUNNING" ] && [ -n "$ip" ] && break
              sleep 5
            done
          fi

          echo "Waiting for Minecraft listener on $ip:25565..."
          for attempt in $(seq 1 72); do
            if timeout 3 bash -c "</dev/tcp/$ip/25565" >/dev/null 2>&1; then
              echo "Minecraft listener is up."
              break
            fi
            sleep 5
          done

          IFS=',' read -r name zone status ip <<< "$name,$zone,$status,$ip"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "zone=$zone" >> "$GITHUB_OUTPUT"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "Using Ratcraft VM: $name ($zone, $ip)"

      - name: Ensure Ratcraft external IP is static
        id: static_ip
        shell: bash
        env:
          MC_IP: ${{ steps.mc.outputs.ip }}
          MC_ZONE: ${{ steps.mc.outputs.zone }}
        run: |
          set -euo pipefail
          region="${MC_ZONE%-*}"

          reserved_name="$(
            gcloud compute addresses list \
              --project "$PROJECT_ID" \
              --regions "$region" \
              --filter="address=$MC_IP" \
              --format="value(name)" \
              | head -n 1
          )"

          if [ -z "$reserved_name" ]; then
            preferred="clouva-minecraft-static-ip"
            if gcloud compute addresses describe "$preferred" --project "$PROJECT_ID" --region "$region" >/dev/null 2>&1; then
              existing_ip="$(gcloud compute addresses describe "$preferred" --project "$PROJECT_ID" --region "$region" --format="value(address)")"
              if [ "$existing_ip" != "$MC_IP" ]; then
                preferred="clouva-minecraft-static-ip-2"
              fi
            fi

            if ! gcloud compute addresses describe "$preferred" --project "$PROJECT_ID" --region "$region" >/dev/null 2>&1; then
              gcloud compute addresses create "$preferred" \
                --project "$PROJECT_ID" \
                --region "$region" \
                --addresses "$MC_IP"
            fi
            reserved_name="$preferred"
          fi

          static_ip="$(gcloud compute addresses describe "$reserved_name" --project "$PROJECT_ID" --region "$region" --format="value(address)")"
          test "$static_ip" = "$MC_IP"
          echo "ip=$static_ip" >> "$GITHUB_OUTPUT"
          echo "name=$reserved_name" >> "$GITHUB_OUTPUT"
          echo "Ratcraft static IP reserved: $reserved_name -> $static_ip"

      - name: Ban GTrein and close Ratcraft
        shell: bash
        env:
          MC_NAME: ${{ steps.mc.outputs.name }}
          MC_ZONE: ${{ steps.mc.outputs.zone }}
        run: |
          set -euo pipefail

          gcloud compute ssh "$MC_NAME"             --project "$PROJECT_ID"             --zone "$MC_ZONE"             --quiet             --ssh-flag="-o ConnectTimeout=10"             --ssh-flag="-o StrictHostKeyChecking=no"             --ssh-flag="-o UserKnownHostsFile=/dev/null"             --command='
              set -euo pipefail

              CONTAINER="$(sudo docker ps --format "{{.Names}}" | grep -E "^(clouva-minecraft|.*minecraft.*)$" | head -n 1)"
              if [ -z "$CONTAINER" ]; then
                echo "Minecraft container not found." >&2
                exit 1
              fi

              echo "Container: $CONTAINER"

              GT_IP="$(
                sudo docker logs --tail 10000 "$CONTAINER" 2>&1                   | grep -Ei "GTrein\[/"                   | tail -n 1                   | sed -nE "s/.*GTrein\[\/([0-9.]+):[0-9]+\].*/\1/p"                   || true
              )"

              sudo docker exec "$CONTAINER" rcon-cli "ban GTrein Unauthorized access to Ratcraft" || true
              if [ -n "$GT_IP" ]; then
                sudo docker exec "$CONTAINER" rcon-cli "ban-ip $GT_IP Unauthorized access to Ratcraft" || true
                echo "GTrein source IP banned: $GT_IP"
              else
                echo "GTrein IP was not present in the retained Docker log; nickname ban remains active."
              fi

              sudo docker exec "$CONTAINER" rcon-cli "whitelist add Clouva" || true
              sudo docker exec "$CONTAINER" rcon-cli "whitelist add ninotimi" || true
              sudo docker exec "$CONTAINER" rcon-cli "whitelist add seba_1230" || true
              sudo docker exec "$CONTAINER" rcon-cli "whitelist on"
              sudo docker exec "$CONTAINER" rcon-cli "whitelist reload" || true
              sudo docker exec "$CONTAINER" rcon-cli "kick GTrein Ratcraft is private" || true

              props=/srv/minecraft/server.properties
              if [ -f "$props" ]; then
                if grep -q "^white-list=" "$props"; then
                  sudo sed -i -E "s/^white-list=.*/white-list=true/" "$props"
                else
                  echo "white-list=true" | sudo tee -a "$props" >/dev/null
                fi

                if grep -q "^enforce-whitelist=" "$props"; then
                  sudo sed -i -E "s/^enforce-whitelist=.*/enforce-whitelist=true/" "$props"
                else
                  echo "enforce-whitelist=true" | sudo tee -a "$props" >/dev/null
                fi
              fi

              echo "===== RATCRAFT ACCESS ====="
              sudo docker exec "$CONTAINER" rcon-cli "whitelist list" || true
              sudo docker exec "$CONTAINER" rcon-cli "banlist players" || true
              sudo docker exec "$CONTAINER" rcon-cli "banlist ips" || true
            '

      - name: Persist secured startup metadata on the live VM
        shell: bash
        env:
          MC_NAME: ${{ steps.mc.outputs.name }}
          MC_ZONE: ${{ steps.mc.outputs.zone }}
        run: |
          gcloud compute instances add-metadata "$MC_NAME"             --project "$PROJECT_ID"             --zone "$MC_ZONE"             --metadata-from-file startup-script=infra/minecraft/startup.sh

      - name: Sync CLOUVA web Minecraft host
        shell: bash
        env:
          MC_IP: ${{ steps.mc.outputs.ip }}
        run: |
          set -euo pipefail
          gcloud run services update clouva-web \
            --project "$PROJECT_ID" \
            --region us-central1 \
            --update-env-vars "MINECRAFT_VM_NAME=${{ steps.mc.outputs.name }},MINECRAFT_VM_ZONE=${{ steps.mc.outputs.zone }},MINECRAFT_HOST=$MC_IP,MINECRAFT_PUBLIC_JAVA_HOST=$MC_IP,MINECRAFT_PUBLIC_BEDROCK_HOST=$MC_IP,MINECRAFT_MAP_UPSTREAM=http://$MC_IP:8100" \
            --quiet

      - name: Verify public listener
        shell: bash
        env:
          MC_IP: ${{ steps.mc.outputs.ip }}
        run: |
          set -euo pipefail
          timeout 4 bash -c "</dev/tcp/$MC_IP/25565"
          echo "Ratcraft is online and secured by whitelist."

      - name: Sync Cloudflare Minecraft DNS when credentials exist
        shell: bash
        env:
          MC_IP: ${{ steps.mc.outputs.ip }}
          CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN_ALT2: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          set -euo pipefail
          CF_TOKEN="${CF_TOKEN_PRIMARY:-${CF_TOKEN_ALT:-${CF_TOKEN_ALT2:-}}}"
          if [ -z "$CF_TOKEN" ]; then
            echo "CLOUDFLARE_DNS_SYNC=SKIPPED_NO_TOKEN"
            exit 0
          fi

          zone_id="$(
            curl -fsS \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=clouva.com.ar&status=active" \
            | jq -r ".result[0].id // empty"
          )"
          test -n "$zone_id"

          record_id="$(
            curl -fsS \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?type=A&name=mc.clouva.com.ar" \
            | jq -r ".result[0].id // empty"
          )"

          payload="$(jq -nc --arg ip "$MC_IP" "{type:\"A\",name:\"mc.clouva.com.ar\",content:\$ip,ttl:60,proxied:false}")"

          if [ -n "$record_id" ]; then
            curl -fsS -X PATCH \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id" \
              | jq -e ".success == true" >/dev/null
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
              | jq -e ".success == true" >/dev/null
          fi
          echo "CLOUDFLARE_DNS_SYNC=OK"

      - name: Resolve mc.clouva.com.ar
        shell: bash
        run: |
          echo "LIVE_IP=${{ steps.mc.outputs.ip }}"
          printf "DNS_IPS="
          getent ahostsv4 mc.clouva.com.ar | awk "{print \$1}" | sort -u | paste -sd, - || true

      - name: Inspect Minecraft infrastructure pointers
        shell: bash
        run: |
          echo "===== RESERVED ADDRESSES ====="
          gcloud compute addresses list --project "$PROJECT_ID"             --format='table(name,address,region.basename(),status,users)' || true

          echo "===== CLOUVA WEB MINECRAFT ENV ====="
          gcloud run services describe clouva-web             --project "$PROJECT_ID"             --region us-central1             --format=json             | python3 -c 'import json,sys; d=json.load(sys.stdin); env=d.get("spec",{}).get("template",{}).get("spec",{}).get("containers",[{}])[0].get("env",[]); print("\n".join(f"{x.get(\"name\")}=<secret>" if "valueFrom" in x else f"{x.get(\"name\")}={x.get(\"value\",\"\")}" for x in env if x.get("name","").startswith("MINECRAFT_")))'

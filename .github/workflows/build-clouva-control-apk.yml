name: Build CLOUVA CONTROL APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version semántica, por ejemplo 1.0.0
        required: true
        type: string
      release_notes:
        description: Notas visibles dentro de CLOUVA
        required: true
        type: string
      stable:
        description: Marcar como versión estable
        required: true
        default: true
        type: boolean
      minimum_required:
        description: Versión mínima obligatoria; dejar vacío para no bloquear
        required: false
        type: string
  push:
    tags:
      - "clouva-control-v*"

permissions:
  contents: read

concurrency:
  group: clouva-control-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/clouva-control
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_NOTES: ${{ inputs.release_notes || format('Release {0}', github.ref_name) }}
      IS_STABLE: ${{ inputs.stable || true }}
      MINIMUM_REQUIRED: ${{ inputs.minimum_required }}
      EXPO_PUBLIC_CLOUVA_API_URL: ${{ vars.CLOUVA_CONTROL_API_URL || 'https://clouva.com.ar' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/clouva-control/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve version and build number
        id: release
        shell: bash
        run: |
          version="$VERSION"
          version="${version#clouva-control-v}"
          test -n "$version"
          build_number="${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Install base dependencies
        run: npm install --no-audit --no-fund

      - name: Install Expo-compatible native packages
        run: npm run expo:sync

      - name: Typecheck native app
        run: npm run typecheck

      - name: Generate Android project
        env:
          CLOUVA_CONTROL_VERSION: ${{ steps.release.outputs.version }}
          CLOUVA_CONTROL_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CLOUVA_CONTROL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/clouva-control-release.jks

      - name: Configure Android signing
        env:
          CLOUVA_CONTROL_KEYSTORE_PATH: ${{ github.workspace }}/mobile/clouva-control/android/keystore/clouva-control-release.jks
          CLOUVA_CONTROL_KEY_ALIAS: ${{ secrets.CLOUVA_CONTROL_KEY_ALIAS }}
          CLOUVA_CONTROL_KEYSTORE_PASSWORD: ${{ secrets.CLOUVA_CONTROL_KEYSTORE_PASSWORD }}
          CLOUVA_CONTROL_KEY_PASSWORD: ${{ secrets.CLOUVA_CONTROL_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs

      - name: Build signed release APK
        env:
          CLOUVA_CONTROL_KEYSTORE_PATH: ${{ github.workspace }}/mobile/clouva-control/android/keystore/clouva-control-release.jks
          CLOUVA_CONTROL_KEY_ALIAS: ${{ secrets.CLOUVA_CONTROL_KEY_ALIAS }}
          CLOUVA_CONTROL_KEYSTORE_PASSWORD: ${{ secrets.CLOUVA_CONTROL_KEYSTORE_PASSWORD }}
          CLOUVA_CONTROL_KEY_PASSWORD: ${{ secrets.CLOUVA_CONTROL_KEY_PASSWORD }}
        run: ./android/gradlew -p android assembleRelease --no-daemon

      - name: Prepare release metadata
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk"
          filename="clouva-control-${{ steps.release.outputs.version }}.apk"
          cp "$source_apk" "dist/$filename"
          checksum="$(sha256sum "dist/$filename" | awk '{print $1}')"
          size="$(stat -c%s "dist/$filename")"
          storage_path="clouva-control/${{ steps.release.outputs.version }}/$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "storage_path=$storage_path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: clouva-control-${{ steps.release.outputs.version }}
          path: mobile/clouva-control/dist/${{ steps.artifact.outputs.filename }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to private Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl --fail --silent --show-error \
            -X POST "$SUPABASE_URL/storage/v1/object/admin-apk-releases/${{ steps.artifact.outputs.storage_path }}" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@dist/${{ steps.artifact.outputs.filename }}"

      - name: Register release in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          stable="${IS_STABLE:-true}"
          minimum="${MINIMUM_REQUIRED:-}"
          payload="$(jq -n \
            --arg app_name "CLOUVA CONTROL" \
            --arg platform "android" \
            --arg version "${{ steps.release.outputs.version }}" \
            --argjson build_number "${{ steps.release.outputs.build_number }}" \
            --arg storage_path "${{ steps.artifact.outputs.storage_path }}" \
            --argjson file_size "${{ steps.artifact.outputs.size }}" \
            --arg checksum "${{ steps.artifact.outputs.checksum }}" \
            --arg release_notes "$RELEASE_NOTES" \
            --arg stable "$stable" \
            --arg minimum "$minimum" \
            '{app_name:$app_name,platform:$platform,version:$version,build_number:$build_number,storage_path:$storage_path,file_size:$file_size,checksum:$checksum,release_notes:$release_notes,is_stable:($stable=="true"),minimum_required:(if $minimum=="" then null else $minimum end),published_at:(now|todateiso8601)}')"
          curl --fail --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/mobile_app_releases?on_conflict=app_name,platform,version,build_number" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            --data "$payload"

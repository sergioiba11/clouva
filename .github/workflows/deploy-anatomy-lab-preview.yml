name: Deploy Anatomy Lab Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175
  REGION: us-central1
  SERVICE: clouva-anatomy-lab-preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workspace-official-v1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analyzer/anatomy-lab/backend/requirements.txt

      - name: Backend startup smoke
        working-directory: analyzer/anatomy-lab
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          import main
          print(main.health())
          PY

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build Anatomy Lab image
        env:
          IMAGE: us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/clouva/clouva-anatomy-lab:${{ github.sha }}
        run: |
          cd analyzer/anatomy-lab
          BUILD_ID="$(gcloud builds submit \
            --project "$PROJECT_ID" \
            --tag "$IMAGE" \
            --async \
            --format='value(id)' \
            .)"
          echo "Cloud Build: $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --format='value(status)')"
            echo "Build status: $STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            sleep 10
          done
          exit 1

      - name: Deploy isolated Analyzer snapshot
        env:
          IMAGE: us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/clouva/clouva-anatomy-lab:${{ github.sha }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 4Gi \
            --concurrency 1 \
            --timeout 900 \
            --min-instances 0 \
            --max-instances 1 \
            --quiet

      - name: Verify Analyzer snapshot health
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$url/health"; then
              echo "Snapshot health OK: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          exit 1

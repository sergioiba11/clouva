name: Validate CLOUVA AI

on:
  pull_request:
    paths:
      - "app/api/clouva-ai/**"
      - "components/clouva-ai/**"
      - "lib/clouva-ai/**"
      - "lib/media-generation-client.ts"
      - "lib/media-generation-config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-clouva-ai.yml"
  workflow_dispatch:

concurrency:
  group: validate-clouva-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

name: Avatar Analyzer V4 validation

on:
  pull_request:
    paths:
      - "app/avatar-analyzer-v4/**"
      - "components/library/AvatarAnalyzerV4Diagnostics.tsx"
      - "components/library/avatar-analyzer-v4-diagnostics.module.css"
      - "worker/garment-rig/**"
      - "tests-avatar-analyzer-v4.mjs"
      - "docs/avatar-analyzer-v4.md"
      - "examples/avatar-analyzer-v4-*.json"
      - ".github/workflows/avatar-analyzer-v4.yml"
  push:
    branches:
      - codex/avatar-analyzer-v41-profile-projection-fix
    paths:
      - ".github/workflows/avatar-analyzer-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-body-basic-gates:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/avatar-analyzer-v41-profile-projection-fix
          fetch-depth: 0
      - name: Patch Analyzer contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('worker/garment-rig/analyzer_v4_contract.py')
          text = path.read_text()
          old = '''    result: dict[str, Any] = {
        "body_supported": bool(analysis.get("isHumanoid", True)) and _float(analysis.get("humanoidConfidence"), 0.0) >= 0.40,
        "face_surface_supported": int((regions.get("head") or {}).get("vertexCount") or 0) >= 4,
        "facial_rig_supported": False,
    }
'''
          new = '''    orientation = analysis.get("orientation") if isinstance(analysis.get("orientation"), dict) else {}
    orientation_valid = not bool(orientation.get("requiresOrientationReview"))
    subsystem_reports = analysis.get("bodySubsystems") if isinstance(analysis.get("bodySubsystems"), dict) else {}
    required_subsystems = ("body_core", "left_arm", "right_arm", "left_leg", "right_leg")
    subsystem_failures = [
        name for name in required_subsystems
        if not isinstance(subsystem_reports.get(name), dict)
        or str((subsystem_reports.get(name) or {}).get("status") or "") not in {"valid", "valid_with_warnings"}
        or bool((subsystem_reports.get(name) or {}).get("missingOrInvalid"))
        or bool((subsystem_reports.get(name) or {}).get("blockingWarnings"))
    ]
    subsystems_valid = not subsystem_failures
    result: dict[str, Any] = {
        "body_supported": bool(
            analysis.get("isHumanoid", True)
            and _float(analysis.get("humanoidConfidence"), 0.0) >= 0.40
            and orientation_valid
            and subsystems_valid
        ),
        "orientation_valid": orientation_valid,
        "body_subsystems_valid": subsystems_valid,
        "body_subsystem_failures": subsystem_failures,
        "face_surface_supported": int((regions.get("head") or {}).get("vertexCount") or 0) >= 4,
        "facial_rig_supported": False,
    }
'''
          if text.count(old) != 1:
              raise SystemExit('infer_topology_capabilities body block not found exactly once')
          text = text.replace(old, new, 1)
          old = '''    missing = [name for name in BODY_REQUIRED if not _approved(landmarks, name)]
    return _profile_result(bool(capabilities.get("body_supported")) and not missing, missing)
'''
          new = '''    missing = [name for name in BODY_REQUIRED if not _approved(landmarks, name)]
    if not capabilities.get("orientation_valid", True):
        missing.append("orientation")
    if not capabilities.get("body_subsystems_valid", True):
        failures = capabilities.get("body_subsystem_failures") or ["body_subsystems"]
        missing.extend(f"subsystem:{name}" for name in failures)
    return _profile_result(bool(capabilities.get("body_supported")) and not missing, missing)
'''
          if text.count(old) != 1:
              raise SystemExit('evaluate_body_basic_readiness block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/apply-avatar-v41-body-basic-gates.yml').unlink(missing_ok=True)
          PY
          git checkout origin/main -- .github/workflows/avatar-analyzer-v4.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require valid orientation and body subsystems for BODY_BASIC"
          git push origin HEAD:codex/avatar-analyzer-v41-profile-projection-fix

  contract:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pure V4 contract tests
        working-directory: worker/garment-rig
        run: python -m unittest -v test_avatar_analyzer_v4_contract.py test_avatar_analyzer_v41.py
      - name: Frontend/API source contract
        run: node --test tests-avatar-analyzer-v4.mjs
      - name: Compile pure Python modules
        working-directory: worker/garment-rig
        run: python -m py_compile analyzer_v4_contract.py analyzer_v4_bootstrap.py anatomy_semantics.py hand_modes.py camera_projection_self_test_v4.py

  frontend:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Lint V4 frontend files
        run: npx eslint app/avatar-analyzer-v4 components/library/AvatarAnalyzerV4Diagnostics.tsx tests-avatar-analyzer-v4.mjs

  worker:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Blender Worker without publishing
        run: |
          docker buildx build \
            --progress=plain \
            --cache-from type=gha,scope=avatar-analyzer-v4 \
            --cache-to type=gha,mode=max,scope=avatar-analyzer-v4 \
            --output type=cacheonly \
            --file worker/garment-rig/Dockerfile \
            worker/garment-rig

name: Avatar Analyzer V4 validation

on:
  pull_request:
    paths:
      - "app/avatar-analyzer-v4/**"
      - "components/library/AvatarAnalyzerV4Diagnostics.tsx"
      - "components/library/avatar-analyzer-v4-diagnostics.module.css"
      - "worker/garment-rig/**"
      - "tests-avatar-analyzer-v4.mjs"
      - "docs/avatar-analyzer-v4.md"
      - "examples/avatar-analyzer-v4-*.json"
      - ".github/workflows/avatar-analyzer-v4.yml"
  push:
    branches:
      - codex/avatar-analyzer-v41-profile-projection-fix
    paths:
      - ".github/workflows/avatar-analyzer-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-body-basic-gates:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/avatar-analyzer-v41-profile-projection-fix
          fetch-depth: 0
      - name: Apply contract patch
        run: |
          base64 -d .github/scripts/avatar_v41_body_gates_patch.py.gz.b64 | gzip -d > /tmp/avatar_v41_body_gates_patch.py
          python /tmp/avatar_v41_body_gates_patch.py
          git checkout origin/main -- .github/workflows/avatar-analyzer-v4.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require valid orientation and body subsystems for BODY_BASIC"
          git push origin HEAD:codex/avatar-analyzer-v41-profile-projection-fix

  contract:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pure V4 contract tests
        working-directory: worker/garment-rig
        run: python -m unittest -v test_avatar_analyzer_v4_contract.py test_avatar_analyzer_v41.py
      - name: Frontend/API source contract
        run: node --test tests-avatar-analyzer-v4.mjs
      - name: Compile pure Python modules
        working-directory: worker/garment-rig
        run: python -m py_compile analyzer_v4_contract.py analyzer_v4_bootstrap.py anatomy_semantics.py hand_modes.py camera_projection_self_test_v4.py

  frontend:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Lint V4 frontend files
        run: npx eslint app/avatar-analyzer-v4 components/library/AvatarAnalyzerV4Diagnostics.tsx tests-avatar-analyzer-v4.mjs

  worker:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Blender Worker without publishing
        run: |
          docker buildx build \
            --progress=plain \
            --cache-from type=gha,scope=avatar-analyzer-v4 \
            --cache-to type=gha,mode=max,scope=avatar-analyzer-v4 \
            --output type=cacheonly \
            --file worker/garment-rig/Dockerfile \
            worker/garment-rig

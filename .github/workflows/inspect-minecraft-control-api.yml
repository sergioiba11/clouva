name: Inspect Minecraft Control API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-minecraft-control-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175
  REGION: us-central1
  API_SERVICE: clouva-mc-control-api

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect service
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          image="$(gcloud run services describe "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          echo "URL=$url"
          echo "IMAGE=$image"
          echo "ENV_NAMES:"
          gcloud run services describe "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json             | jq -r '.spec.template.spec.containers[0].env[]? | .name' | sort -u

          for path in / /health /api/full /api/status /api/start /api/stop /api/restart /api/players /api/command; do
            echo "===== $path ====="
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 10 "$url$path" || true)"
            echo "HTTP=$code"
            head -c 1200 /tmp/body || true
            echo
          done

      - name: Probe authenticated API contract
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          token="$(gcloud run services describe "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="MC_TOKEN") | .value' | head -n 1)"
          test -n "$token"

          for header in authorization x-mc-token x-api-key; do
            echo "===== AUTH $header /api/full ====="
            case "$header" in
              authorization) args=(-H "Authorization: Bearer $token") ;;
              x-mc-token) args=(-H "X-MC-Token: $token") ;;
              x-api-key) args=(-H "X-API-Key: $token") ;;
            esac
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 10 "${args[@]}" "$url/api/full" || true)"
            echo "HTTP=$code"
            head -c 1200 /tmp/body || true
            echo
          done

          echo "===== POST /api/command no-op list ====="
          for header in authorization x-mc-token; do
            case "$header" in
              authorization) args=(-H "Authorization: Bearer $token") ;;
              x-mc-token) args=(-H "X-MC-Token: $token") ;;
            esac
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 10 -X POST "${args[@]}" -H "Content-Type: application/json" --data '{"command":"list"}' "$url/api/command" || true)"
            echo "$header HTTP=$code"
            head -c 1200 /tmp/body || true
            echo
          done

      - name: Inspect public control HTML contract
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          curl -fsSL "$url/" -o /tmp/root.html
          grep -Ein "token|authorization|x-mc|api/full|api/status|api/command|api/start|api/stop|api/restart|fetch\(" /tmp/root.html | head -n 200 || true

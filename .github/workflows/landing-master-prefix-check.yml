name: Check landing master prefix

on:
  push:
    branches:
      - landing-welcome-final

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check staged prefix
        run: |
          set -euo pipefail
          cat tools/landing-master/part-*.b64 > /tmp/landing-prefix.b64
          echo "bytes=$(wc -c < /tmp/landing-prefix.b64)"
          sha256sum /tmp/landing-prefix.b64

name: Check landing master prefix

on:
  push:
    branches:
      - landing-welcome-final

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check staged prefix
        run: |
          set -euo pipefail
          cat tools/landing-master/part-*.b64 > /tmp/landing-prefix.b64
          echo "bytes=$(wc -c < /tmp/landing-prefix.b64)"
          for n in 12000 24000 36000 48000 60000 72000 82001 90834 98146; do
            printf '%s ' "$n"
            head -c "$n" /tmp/landing-prefix.b64 | sha256sum | cut -d' ' -f1
          done

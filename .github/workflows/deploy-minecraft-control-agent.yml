name: Deploy Minecraft Control Agent

on:
  push:
    branches: [main]
    paths:
      - "infra/minecraft/control-agent.py"
      - "infra/minecraft/control-agent.service"
      - ".github/workflows/deploy-minecraft-control-agent.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175
  MC_ZONE: southamerica-east1-b
  MC_INSTANCE: clouva-minecraft

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload control agent
        run: |
          gcloud compute scp \
            infra/minecraft/control-agent.py \
            infra/minecraft/control-agent.service \
            "$MC_INSTANCE:/tmp/" \
            --project "$PROJECT_ID" \
            --zone "$MC_ZONE" \
            --quiet

      - name: Install and start control agent
        run: |
          gcloud compute ssh "$MC_INSTANCE" \
            --project "$PROJECT_ID" \
            --zone "$MC_ZONE" \
            --quiet \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --ssh-flag="-o UserKnownHostsFile=/dev/null" \
            --command='
              set -euo pipefail
              sudo install -m 0755 /tmp/control-agent.py /usr/local/sbin/clouva-minecraft-control-agent.py
              sudo install -m 0644 /tmp/control-agent.service /etc/systemd/system/clouva-minecraft-control-agent.service
              sudo systemctl daemon-reload
              sudo systemctl enable --now clouva-minecraft-control-agent.service
              sleep 2
              sudo systemctl is-active clouva-minecraft-control-agent.service
              sudo journalctl -u clouva-minecraft-control-agent.service -n 20 --no-pager
            '

      - name: Verify private command channel
        shell: bash
        run: |
          set -euo pipefail
          id="verify-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '{"id":"%s","action":"list","args":{},"actorId":"github-actions","issuedAt":"%s"}' "$id" "$(date -u +%FT%TZ)" > /tmp/ratcraft-command.json

          gcloud compute instances add-metadata "$MC_INSTANCE" \
            --project "$PROJECT_ID" \
            --zone "$MC_ZONE" \
            --metadata-from-file ratcraft-command=/tmp/ratcraft-command.json \
            --quiet

          for attempt in $(seq 1 15); do
            if gcloud compute ssh "$MC_INSTANCE" \
              --project "$PROJECT_ID" \
              --zone "$MC_ZONE" \
              --quiet \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --ssh-flag="-o UserKnownHostsFile=/dev/null" \
              --command="sudo cat /srv/minecraft/ratcraft-control-last.json 2>/dev/null" \
              | grep -Fq "\"id\": \"$id\""; then
              echo "Ratcraft private command channel is working."
              exit 0
            fi
            sleep 2
          done

          echo "::error::Control agent did not execute the verification command."
          gcloud compute ssh "$MC_INSTANCE" \
            --project "$PROJECT_ID" \
            --zone "$MC_ZONE" \
            --quiet \
            --command='sudo journalctl -u clouva-minecraft-control-agent.service -n 80 --no-pager' || true
          exit 1

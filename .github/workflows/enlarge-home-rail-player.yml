name: Enlarge Home rail Player identity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/enlarge-home-rail-player.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enlarge Player identity proportions in right rail
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("components/clouva/HomeDashboard.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'className="flex w-full min-w-0 flex-col items-center justify-center gap-1.5 rounded-xl px-1 py-2 text-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400/70"',
                  'className="flex min-h-[100px] w-full min-w-0 flex-col items-center justify-center gap-2 rounded-xl px-1 py-3 text-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400/70"',
              ),
              (
                  'className="relative grid h-11 w-11 shrink-0 place-items-center"',
                  'className="relative grid h-[52px] w-[52px] shrink-0 place-items-center"',
              ),
              (
                  'className="pointer-events-none absolute left-1/2 top-1/2 h-[58px] w-[58px] max-w-none -translate-x-1/2 -translate-y-1/2 select-none object-contain drop-shadow-[0_0_8px_rgba(184,71,255,0.55)]"',
                  'className="pointer-events-none absolute left-1/2 top-1/2 h-[68px] w-[68px] max-w-none -translate-x-1/2 -translate-y-1/2 select-none object-contain drop-shadow-[0_0_10px_rgba(184,71,255,0.58)]"',
              ),
              (
                  'className="relative z-[1] grid h-[34px] w-[34px] place-items-center overflow-hidden rounded-full border border-white/20 bg-[#100a17] shadow-[0_0_14px_rgba(142,61,236,0.3)]"',
                  'className="relative z-[1] grid h-[40px] w-[40px] place-items-center overflow-hidden rounded-full border border-white/20 bg-[#100a17] shadow-[0_0_16px_rgba(142,61,236,0.34)]"',
              ),
              (
                  'className="block truncate text-[11px] font-extrabold text-white"',
                  'className="block truncate text-[12px] font-extrabold text-white"',
              ),
              (
                  'className="mt-1 block truncate text-[9px] font-medium text-violet-200/60"',
                  'className="mt-1 block truncate text-[9.5px] font-medium text-violet-200/60"',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected Home Player identity fragment not found: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit definitive proportion adjustment
        run: |
          rm .github/workflows/enlarge-home-rail-player.yml
          git config user.name "Clouva"
          git config user.email "sergio.iba.11@gmail.com"
          git add components/clouva/HomeDashboard.tsx .github/workflows/enlarge-home-rail-player.yml
          git commit -m "fix(home): enlarge Player identity card proportions"
          git push origin main

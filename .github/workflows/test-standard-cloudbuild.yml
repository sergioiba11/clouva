name: Test standard Cloud Build resources

on:
  push:
    branches: [main]
    paths:
      - "cloudbuild-web-standard-diagnostic.yaml"
      - ".github/workflows/test-standard-cloudbuild.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build with standard Cloud Build machine
        run: |
          gcloud builds submit \
            --project "$PROJECT_ID" \
            --config cloudbuild-web-standard-diagnostic.yaml \
            --substitutions="_NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},_NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }},_NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }},_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }},_NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }},_NEXT_PUBLIC_IGLU_RADIO_STREAM_URL=${{ vars.NEXT_PUBLIC_IGLU_RADIO_STREAM_URL }},_DEPLOY_REF=main,COMMIT_SHA=$GITHUB_SHA" \
            .

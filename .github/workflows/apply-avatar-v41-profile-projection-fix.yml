name: Apply Avatar Analyzer V4.1 profile projection fix

on:
  push:
    branches:
      - codex/avatar-analyzer-v41-profile-projection-fix
    paths:
      - .github/workflows/apply-avatar-v41-profile-projection-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/avatar-analyzer-v41-profile-projection-fix
      - name: Apply implementation
        shell: bash
        run: |
          base64 -d .github/scripts/avatar_v41_profile_projection_fix.py.gz.b64 | gzip -d > .github/scripts/avatar_v41_profile_projection_fix.py
          python .github/scripts/avatar_v41_profile_projection_fix.py
          rm -f .github/scripts/avatar_v41_profile_projection_fix.py
          rm -f .github/scripts/avatar_v41_profile_projection_fix.py.gz.b64
          rm -f .github/workflows/apply-avatar-v41-profile-projection-fix.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: separate BODY_BASIC readiness and preserve technical projections"
          git push origin HEAD:codex/avatar-analyzer-v41-profile-projection-fix

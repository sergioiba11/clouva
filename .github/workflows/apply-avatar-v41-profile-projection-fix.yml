name: Apply Avatar Analyzer V4.1 profile projection fix

on:
  push:
    branches:
      - codex/avatar-analyzer-v41-profile-projection-fix
    paths:
      - .github/workflows/apply-avatar-v41-profile-projection-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/avatar-analyzer-v41-profile-projection-fix

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Decode and apply implementation patch
        shell: bash
        run: |
          mkdir -p .github/scripts
          cat > /tmp/avatar-v41-fix.py.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/avatar-v41-fix.py.gz.b64 | gzip -d > .github/scripts/avatar_v41_profile_projection_fix.py
          python .github/scripts/avatar_v41_profile_projection_fix.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Avatar Analyzer frontend contracts
        run: npm run test:avatar-analyzer

      - name: Avatar Analyzer Python contracts
        run: npm run test:avatar-analyzer:python

      - name: Production build
        run: npm run build

      - name: Worker Docker build
        run: docker build -t clouva-avatar-analyzer-v41-fix worker/garment-rig

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/scripts/avatar_v41_profile_projection_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: separate BODY_BASIC readiness and preserve technical projections"
          git push origin HEAD:codex/avatar-analyzer-v41-profile-projection-fix

name: Deploy MediaPipe detector

on:
  push:
    branches:
      - main
    paths:
      - "worker/mediapipe-service/**"
      - "worker/garment-rig/landmark_detector_2d.py"
      - ".github/workflows/deploy-mediapipe.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-mediapipe
  cancel-in-progress: false

env:
  PROJECT_ID: gen-lang-client-0737053175
  REGION: us-central1
  SERVICE: clouva-mediapipe-detector

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync canonical detector logic from worker/garment-rig
        run: cp worker/garment-rig/landmark_detector_2d.py worker/mediapipe-service/landmark_detector_2d.py

      - name: Deploy clouva-mediapipe-detector to Cloud Run
        env:
          DEPLOYED_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source worker/mediapipe-service \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 180 \
            --update-env-vars "CLOUVA_DEPLOYED_COMMIT=$DEPLOYED_COMMIT,CLOUVA_DEPLOYED_REF=$SOURCE_REF" \
            --quiet

      - name: Remove synced file from working tree
        if: always()
        run: rm -f worker/mediapipe-service/landmark_detector_2d.py

      - name: Resolve deployed revision
        id: deployed
        run: |
          service_url="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')"
          test -n "$service_url"
          test -n "$revision"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Verify health
        env:
          SERVICE_URL: ${{ steps.deployed.outputs.service_url }}
        run: |
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$SERVICE_URL/health" | tee mediapipe-health.json

      - name: Build deployment evidence
        env:
          SERVICE_URL: ${{ steps.deployed.outputs.service_url }}
          REVISION: ${{ steps.deployed.outputs.revision }}
          DEPLOYED_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          status = {
              "service": "clouva-mediapipe-detector",
              "project": os.environ["PROJECT_ID"],
              "region": os.environ["REGION"],
              "url": os.environ["SERVICE_URL"],
              "revision": os.environ["REVISION"],
              "sourceCommit": os.environ["DEPLOYED_COMMIT"],
              "sourceRef": os.environ.get("SOURCE_REF"),
              "healthEndpoint": "/health",
              "healthVerified": True,
              "deployedAt": datetime.now(timezone.utc).isoformat(),
          }
          Path("deployment-status.json").write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mediapipe-deployment-${{ steps.deployed.outputs.revision }}
          path: |
            deployment-status.json
            mediapipe-health.json
          if-no-files-found: error
          retention-days: 30

name: Validate CLOUVA Video AI Runpod worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/video-enhance/**"
      - "lib/runpod-video.ts"
      - "app/api/video/enhance/**"
      - ".github/workflows/deploy-video-enhance.yml"
  pull_request:
    branches:
      - main
    paths:
      - "worker/video-enhance/**"
      - "lib/runpod-video.ts"
      - "app/api/video/enhance/**"
      - ".github/workflows/deploy-video-enhance.yml"

permissions:
  contents: read

jobs:
  validate-runpod-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python3 -m py_compile worker/video-enhance/runpod_worker.py

      - name: Validate Runpod Dockerfile contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'runpod_worker.py' worker/video-enhance/Dockerfile.runpod
          grep -q 'runpod==1.12.0' worker/video-enhance/requirements.txt
          grep -q 'CMD \["python3", "/app/runpod_worker.py"\]' worker/video-enhance/Dockerfile.runpod
          echo "Runpod worker contract OK"

name: Sync CLOUVA Cloud Run runtime config
# Runtime contract for Cloud Tasks-backed asset imports.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-cloud-run-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-cloud-run-runtime
  cancel-in-progress: false

env:
  PROJECT_ID: gen-lang-client-0737053175
  REGION: us-central1
  SERVICE: clouva-web

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve existing secret binding
        id: secret
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > /tmp/service.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("/tmp/service.json", "r", encoding="utf-8"))
          env = data.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [{}])[0].get("env", [])
          target = next((x for x in env if x.get("name") == "CLOUVA_ADMIN_UPLOAD_SECRET"), None)
          ref = (target or {}).get("valueFrom", {}).get("secretKeyRef", {})
          name = str(ref.get("name") or "")
          version = str(ref.get("key") or "latest")
          if not name:
              raise SystemExit("CLOUVA_ADMIN_UPLOAD_SECRET is not backed by Secret Manager.")
          print(f"name={name}")
          print(f"version={version}")
          PY

      - name: Sync asset import variables
        run: |
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-env-vars "CLOUVA_ASSET_IMPORT_TASKS_PROJECT=$PROJECT_ID,CLOUVA_ASSET_IMPORT_TASKS_LOCATION=$REGION,CLOUVA_ASSET_IMPORT_TASKS_QUEUE=clouva-asset-imports,CLOUVA_ASSET_IMPORT_WORKER_URL=https://clouva.com.ar/api/internal/admin/assets/imports/process" \
            --quiet

      - name: Bind worker secret
        env:
          SECRET_NAME: ${{ steps.secret.outputs.name }}
          SECRET_VERSION: ${{ steps.secret.outputs.version }}
        run: |
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-secrets "CLOUVA_ASSET_IMPORT_WORKER_SECRET=$SECRET_NAME:$SECRET_VERSION" \
            --quiet

      - name: Shift traffic to configured revision
        id: runtime
        run: |
          latest="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')"
          test -n "$latest"
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-revisions "$latest=100" \
            --quiet
          echo "revision=$latest" >> "$GITHUB_OUTPUT"

      - name: Verify runtime configuration
        env:
          REVISION: ${{ steps.runtime.outputs.revision }}
        run: |
          gcloud run revisions describe "$REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > /tmp/revision.json
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/revision.json", "r", encoding="utf-8"))
          env = data.get("spec", {}).get("containers", [{}])[0].get("env", [])
          names = {item.get("name") for item in env}
          required = {
              "CLOUVA_ASSET_IMPORT_TASKS_PROJECT",
              "CLOUVA_ASSET_IMPORT_TASKS_LOCATION",
              "CLOUVA_ASSET_IMPORT_TASKS_QUEUE",
              "CLOUVA_ASSET_IMPORT_WORKER_URL",
              "CLOUVA_ASSET_IMPORT_WORKER_SECRET",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Missing runtime variables: " + ", ".join(missing))
          print("Asset import runtime configuration verified.")
          PY

      - name: Verify production traffic and health
        env:
          EXPECTED_REVISION: ${{ steps.runtime.outputs.revision }}
        run: |
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "https://clouva.com.ar/api/health")"
          echo "$response"
          python3 - "$EXPECTED_REVISION" "$response" <<'PY'
          import json, sys
          expected = sys.argv[1]
          payload = json.loads(sys.argv[2])
          assert payload.get("ok") is True, payload
          assert payload.get("revision") == expected, (payload.get("revision"), expected)
          print("Production traffic verified on revision:", expected)
          PY

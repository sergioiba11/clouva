name: Setup CLOUVA Cloud Video Engine infrastructure

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/setup-video-engine-gcp.yml"
      - "scripts/setup-video-engine-infra.sh"
      - "worker/video-render/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175
  REGION: us-central1

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Setup Cloud Video Engine
        env:
          CLOUVA_GCP_PROJECT: ${{ env.PROJECT_ID }}
          CLOUVA_GCP_REGION: ${{ env.REGION }}
          CLOUVA_APP_ORIGIN: https://clouva.com.ar
        run: bash scripts/setup-video-engine-infra.sh

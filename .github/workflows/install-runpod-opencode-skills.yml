name: Install Runpod skills for OpenCode

on:
  push:
    branches:
      - feat/runpod-agent-setup
    paths:
      - ".github/workflows/install-runpod-opencode-skills.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runpod-agent-setup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install official Runpod skills for OpenCode
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          npx -y skills add runpod/runpod-plugins-official             --skill '*'             --agent opencode             --copy             --yes
          echo "=== installed files ==="
          git status --short
          test -d .opencode/skills

      - name: Commit project skills
        run: |
          set -euo pipefail
          git config user.name "clouva-bot"
          git config user.email "admin@clouva.com.ar"
          git add .opencode/skills skills-lock.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated skill changes."
            exit 0
          fi
          git commit -m "chore: install official Runpod skills for OpenCode"
          git push origin HEAD:feat/runpod-agent-setup

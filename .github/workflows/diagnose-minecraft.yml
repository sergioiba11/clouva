name: Diagnose CLOUVA Minecraft

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-minecraft.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175
  MC_ZONE: southamerica-east1-b
  MC_INSTANCE: clouva-minecraft-family

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Instance state
        run: |
          gcloud compute instances describe "$MC_INSTANCE" \
            --project "$PROJECT_ID" \
            --zone "$MC_ZONE" \
            --format="yaml(name,status,lastStartTimestamp,networkInterfaces[0].accessConfigs[0].natIP,metadata.items)"

      - name: Docker state and Minecraft logs
        shell: bash
        run: |
          gcloud compute ssh "$MC_INSTANCE" \
            --project "$PROJECT_ID" \
            --zone "$MC_ZONE" \
            --quiet \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --ssh-flag="-o UserKnownHostsFile=/dev/null" \
            --command='
              set +e
              echo "===== DOCKER PS ====="
              sudo docker ps -a --no-trunc
              echo "===== CONTAINER INSPECT ====="
              sudo docker inspect clouva-minecraft
              echo "===== MINECRAFT LOGS ====="
              sudo docker logs --tail 500 clouva-minecraft 2>&1
              echo "===== MEMORY ====="
              free -h
              echo "===== DISK ====="
              df -h
            '

      - name: BlueMap HTTP diagnostics
        shell: bash
        run: |
          echo "===== PUBLIC CLOUVA MAP ====="
          curl -vkL --max-time 20 https://clouva.com.ar/minecraft/map/ -o /tmp/clouva-map.html 2>&1 | tail -n 120 || true
          echo "===== PUBLIC HTML HEAD ====="
          head -n 80 /tmp/clouva-map.html 2>/dev/null || true
          echo "===== PUBLIC ASSET PATHS ====="
          grep -Eo '(src|href)="[^"]+"' /tmp/clouva-map.html 2>/dev/null | head -n 80 || true

          echo "===== VM LOCAL BLUEMAP ====="
          gcloud compute ssh "$MC_INSTANCE" \
            --project "$PROJECT_ID" \
            --zone "$MC_ZONE" \
            --quiet \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --ssh-flag="-o UserKnownHostsFile=/dev/null" \
            --command='
              set +e
              curl -svL --max-time 10 http://127.0.0.1:8100/ -o /tmp/bluemap-index.html 2>&1 | tail -n 100
              echo "----- INDEX HEAD -----"
              head -n 80 /tmp/bluemap-index.html
              echo "----- ASSETS -----"
              grep -Eo "(src|href)=\"[^\"]+\"" /tmp/bluemap-index.html | head -n 80
              echo "----- BLUEMAP CONFIG -----"
              sed -n "1,220p" /srv/minecraft/plugins/BlueMap/webserver.conf 2>/dev/null || true
              sed -n "1,220p" /srv/minecraft/plugins/BlueMap/webapp.conf 2>/dev/null || true
              echo "----- PORTS -----"
              sudo ss -lntp | grep -E ":8100|:25565" || true
            '

      - name: Startup serial output
        shell: bash
        run: |
          set +e
          for port in 1 2 3 4; do
            echo "===== SERIAL PORT $port ====="
            gcloud compute instances get-serial-port-output "$MC_INSTANCE" \
              --project "$PROJECT_ID" \
              --zone "$MC_ZONE" \
              --port "$port" 2>&1 | tail -n 1200
          done


name: Diagnose last Cloud Build failure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cloudbuild-failure.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Describe failed build
        run: |
          set +e
          BUILD_ID="c67e4d6a-6ad5-4ca9-9154-1f4e59cadb0e"
          echo "===== DESCRIBE ====="
          gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --format=yaml
          echo "===== LOG ====="
          gcloud builds log "$BUILD_ID" --project "$PROJECT_ID"
          exit 0

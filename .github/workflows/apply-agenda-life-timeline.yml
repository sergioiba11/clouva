name: Apply Agenda life timeline

on:
  push:
    branches:
      - main
    paths:
      - "scripts/apply-agenda-life-timeline.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-agenda-life-timeline
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: agenda-ci-anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: agenda-ci-service-role-placeholder
      APP_BASE_URL: https://clouva.com.ar
      NEXT_PUBLIC_APP_URL: https://clouva.com.ar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply implementation
        run: python3 scripts/apply-agenda-life-timeline.py
      - name: Typecheck
        run: npm run typecheck
      - name: Lint touched surfaces
        run: >-
          npx eslint
          app/agenda
          app/api/agenda
          app/api/notifications
          components/notifications/NotificationBell.tsx
          components/GlobalFlowBalance.tsx
          lib/server/agenda
          lib/agenda/participation-policy.ts
          tests-agenda-life-timeline.mjs
      - name: Agenda life timeline tests
        run: node --import tsx --test tests-agenda-life-timeline.mjs
      - name: Production build
        run: npm run build
      - name: Commit implementation
        run: |
          rm scripts/apply-agenda-life-timeline.py .github/workflows/apply-agenda-life-timeline.yml
          git restore --source=HEAD --worktree --staged public/assets/clouva/landing-bg-v6.webp 2>/dev/null || rm -f public/assets/clouva/landing-bg-v6.webp
          git config user.name "CLOUVA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(agenda): add pending participants and life timeline"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

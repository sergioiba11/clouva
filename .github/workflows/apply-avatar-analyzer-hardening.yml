name: Apply Avatar Analyzer V4.1 hardening

on:
  push:
    branches:
      - codex/avatar-analyzer-v41-hardening
    paths:
      - .github/scripts/apply_avatar_analyzer_backend.py
      - .github/scripts/apply_avatar_analyzer_frontend.py
      - .github/workflows/apply-avatar-analyzer-hardening.yml

permissions:
  contents: write

concurrency:
  group: avatar-analyzer-v41-hardening
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/avatar-analyzer-v41-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply backend hardening
        run: python .github/scripts/apply_avatar_analyzer_backend.py

      - name: Apply frontend hardening
        run: python .github/scripts/apply_avatar_analyzer_frontend.py

      - name: Remove one-time migration files
        run: |
          rm -f .github/scripts/apply_avatar_analyzer_backend.py
          rm -f .github/scripts/apply_avatar_analyzer_frontend.py
          rm -f .github/workflows/apply-avatar-analyzer-hardening.yml

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint modified frontend and API files
        run: >-
          npx eslint
          components/library/AvatarAnalyzerPreview.tsx
          app/api/avatar/analyze/_shared.ts
          app/api/avatar/analyze/route.ts
          app/api/avatar/analyze/job/[jobId]/route.ts
          app/api/avatar/analyze/latest/route.ts
          app/api/avatar/analyze/result/[runId]/route.ts
          tests-avatar-analyzer-v4.mjs

      - name: Avatar Analyzer Node tests
        run: node --test tests-avatar-analyzer-v4.mjs tests-avatar-analyzer-v32.mjs

      - name: Compile changed Worker modules
        run: >-
          python -m py_compile
          worker/garment-rig/app_v17.py
          worker/garment-rig/app_v18.py
          worker/garment-rig/anatomy_segmenter.py
          worker/garment-rig/avatar_analyzer.py
          worker/garment-rig/test_avatar_analyzer_v4_persistence.py

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Avatar Analyzer V4.1 result recovery and mobile states"
          git push origin HEAD:codex/avatar-analyzer-v41-hardening

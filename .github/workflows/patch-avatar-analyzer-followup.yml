name: Patch Avatar Analyzer recovery follow-up

on:
  push:
    branches:
      - claude/error-500-hand-detection-9e2cb4
    paths:
      - .github/scripts/patch_avatar_analyzer_followup.py
      - .github/workflows/patch-avatar-analyzer-followup.yml

permissions:
  contents: write

concurrency:
  group: avatar-analyzer-followup
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/error-500-hand-detection-9e2cb4
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply follow-up
        run: python .github/scripts/patch_avatar_analyzer_followup.py

      - name: Remove one-time migration files
        run: |
          rm -f .github/scripts/patch_avatar_analyzer_followup.py
          rm -f .github/workflows/patch-avatar-analyzer-followup.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint changed TypeScript
        run: >-
          npx eslint
          components/library/AvatarAnalyzerPreview.tsx
          app/api/avatar/analyze/_shared.ts
          app/api/avatar/analyze/latest/route.ts
          tests-avatar-analyzer-v4.mjs

      - name: Avatar Analyzer contracts
        run: node --test tests-avatar-analyzer-v4.mjs tests-avatar-analyzer-v32.mjs

      - name: Compile Worker changes
        run: >-
          python -m py_compile
          worker/garment-rig/app_v18.py
          worker/garment-rig/test_avatar_analyzer_v4_persistence.py

      - name: Commit verified follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Analyzer summaries across devices"
          git push origin HEAD:claude/error-500-hand-detection-9e2cb4

name: Ratcraft recovery inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ratcraft-recovery-inspect.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175
  MC_ZONE: southamerica-east1-b
  MC_INSTANCE: clouva-minecraft

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Cloud recovery sources
        shell: bash
        run: |
          set +e
          echo "===== DISK ====="
          gcloud compute disks describe clouva-minecraft-world             --project "$PROJECT_ID"             --zone "$MC_ZONE"             --format='yaml(name,creationTimestamp,lastAttachTimestamp,resourcePolicies,sourceSnapshot)'
          echo "===== SNAPSHOTS ====="
          gcloud compute snapshots list             --project "$PROJECT_ID"             --filter='sourceDisk~clouva-minecraft-world'             --sort-by='~creationTimestamp'             --format='table(name,creationTimestamp,status,diskSizeGb,sourceDisk)'
          echo "===== SNAPSHOT SCHEDULES ====="
          gcloud compute resource-policies list             --project "$PROJECT_ID"             --filter='snapshotSchedulePolicy:*'             --format='table(name,region,snapshotSchedulePolicy.schedule)'

      - name: Axiom storage
        shell: bash
        run: |
          set +e
          gcloud compute ssh "$MC_INSTANCE"             --project "$PROJECT_ID"             --zone "$MC_ZONE"             --quiet             --ssh-flag="-o StrictHostKeyChecking=no"             --ssh-flag="-o UserKnownHostsFile=/dev/null"             --command='
              echo "===== AXIOM FILES ====="
              sudo find /srv/minecraft/plugins/AxiomPaper -maxdepth 6 -type f -printf "%TY-%Tm-%Td %TH:%TM:%TS %s %p\n" 2>/dev/null | sort -r | head -n 200
              echo "===== OTHER BACKUP/HISTORY FILES ====="
              sudo find /srv/minecraft -maxdepth 5 -type f \( -iname "*backup*" -o -iname "*undo*" -o -iname "*history*" -o -iname "*.bak" \) -printf "%TY-%Tm-%Td %TH:%TM:%TS %s %p\n" 2>/dev/null | sort -r | head -n 200
            '

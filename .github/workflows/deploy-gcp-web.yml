name: Deploy CLOUVA web to Cloud Run
# Release marker: deploy Gemini image REST contract and CLOUVA AI viewport fix.

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "core/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "cloudbuild-web.yaml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-gcp-web.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: deploy-gcp-web
  cancel-in-progress: false

env:
  PROJECT_ID: gen-lang-client-0737053175
  REGION: us-central1
  SERVICE: clouva-web

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark Cloud Run deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$DEPLOYED_COMMIT" \
            -f state=pending \
            -f context='gcloud/clouva-web' \
            -f description='Cloud Run deployment in progress' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      # Secret Manager IAM is infrastructure state and must not be mutated by the
      # per-release deploy identity. Cloud Run keeps the service's configured
      # secret bindings when a new image revision is deployed.
      - name: Build image via Cloud Build
        env:
          DEPLOYED_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          gcloud builds submit \
            --project "$PROJECT_ID" \
            --config cloudbuild-web.yaml \
            --substitutions="_NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},_NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }},_NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }},_DEPLOY_REF=$SOURCE_REF,COMMIT_SHA=$DEPLOYED_COMMIT" \
            .

      - name: Resolve built image digest
        id: image
        env:
          DEPLOYED_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          digest="$(gcloud artifacts docker images describe \
            "us-central1-docker.pkg.dev/$PROJECT_ID/clouva/clouva-web:$DEPLOYED_COMMIT" \
            --format='value(image_summary.digest)')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy new revision (no traffic yet)
        id: deploy
        env:
          IMAGE: us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/clouva/clouva-web@${{ steps.image.outputs.digest }}
        run: |
          suffix="r$(date +%s)"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --revision-suffix "$suffix" \
            --tag "$suffix" \
            --timeout 300 \
            --no-traffic \
            --quiet
          echo "revision=$SERVICE-$suffix" >> "$GITHUB_OUTPUT"
          echo "tag=$suffix" >> "$GITHUB_OUTPUT"

      - name: Verify new revision health and deployed SHA before shifting traffic
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          REVISION: ${{ steps.deploy.outputs.revision }}
          TAG: ${{ steps.deploy.outputs.tag }}
        run: |
          tag_url="https://${TAG}---$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)' | sed -E 's#https://##')"
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 5 \
            "$tag_url/api/health" || true)"
          echo "$response"
          python3 - "$EXPECTED_SHA" "$response" <<'PY'
          import json, sys
          expected = sys.argv[1]
          data = json.loads(sys.argv[2] or "{}")
          assert data.get("ok") is True, data
          assert data.get("commit") == expected, (data.get("commit"), expected)
          print("Health check OK, commit matches:", data.get("commit"))
          PY

      - name: Shift 100% traffic to the new revision
        env:
          REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "$REVISION=100" \
            --quiet

      - name: Build deployment evidence
        env:
          REVISION: ${{ steps.deploy.outputs.revision }}
          DEPLOYED_COMMIT: ${{ steps.source.outputs.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          status = {
              "service": "clouva-web",
              "project": os.environ["PROJECT_ID"],
              "region": os.environ["REGION"],
              "revision": os.environ["REVISION"],
              "sourceCommit": os.environ["DEPLOYED_COMMIT"],
              "sourceRef": os.environ.get("SOURCE_REF"),
              "imageDigest": os.environ["DIGEST"],
              "healthEndpoint": "/api/health",
              "healthVerified": True,
              "deployedAt": datetime.now(timezone.utc).isoformat(),
          }
          Path("deployment-status.json").write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: clouva-web-deployment-${{ steps.deploy.outputs.revision }}
          path: deployment-status.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Cloud Run deployment status
        if: always() && steps.source.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_COMMIT: ${{ steps.source.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description='Cloud Run deployment verified'
          else
            state=failure
            description='Cloud Run deployment failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$DEPLOYED_COMMIT" \
            -f state="$state" \
            -f context='gcloud/clouva-web' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

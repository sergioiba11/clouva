name: Deploy Ratcraft control shell

on:
  push:
    branches: [main]
    paths:
      - "infra/minecraft/control-shell/**"
      - ".github/workflows/deploy-ratcraft-control-shell.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0737053175
  REGION: us-central1
  CONTROL_SERVICE: clouva-mc-control
  API_SERVICE: clouva-mc-control-api
  IMAGE: us-central1-docker.pkg.dev/gen-lang-client-0737053175/clouva/ratcraft-control-shell

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Preserve the current Minecraft control API
        shell: bash
        run: |
          set -euo pipefail

          if gcloud run services describe "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then
            echo "$API_SERVICE already exists; leaving it untouched."
            exit 0
          fi

          image="$(gcloud run services describe "$CONTROL_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          token="$(gcloud run services describe "$CONTROL_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="MC_TOKEN") | .value' | head -n 1)"
          service_account="$(gcloud run services describe "$CONTROL_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')"

          test -n "$image"

          args=(gcloud run deploy "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$image" --allow-unauthenticated --quiet)
          if [ -n "$token" ]; then
            args+=(--set-env-vars "MC_TOKEN=$token")
          fi
          if [ -n "$service_account" ]; then
            args+=(--service-account "$service_account")
          fi
          "${args[@]}"

      - name: Build Ratcraft shell
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(gcloud builds submit infra/minecraft/control-shell --project "$PROJECT_ID" --tag "$IMAGE:$GITHUB_SHA" --async --format='value(id)')"
          test -n "$build_id"
          echo "Cloud Build: $build_id"
          for attempt in $(seq 1 80); do
            status="$(gcloud builds describe "$build_id" --project "$PROJECT_ID" --format='value(status)')"
            echo "Build status: $status"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Ratcraft shell build timed out."
          exit 1

      - name: Deploy Ratcraft shell to the public Minecraft control service
        shell: bash
        run: |
          set -euo pipefail
          api_url="$(gcloud run services describe "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          test -n "$api_url"

          gcloud run deploy "$CONTROL_SERVICE"             --project "$PROJECT_ID"             --region "$REGION"             --image "$IMAGE:$GITHUB_SHA"             --allow-unauthenticated             --set-env-vars "MC_API_UPSTREAM=$api_url"             --quiet

      - name: Verify public Ratcraft screen
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            body="$(curl -fsSL --max-time 20 "https://clouva.com.ar/minecraft?ratcraft_shell=$GITHUB_SHA" || true)"
            if printf '%s' "$body" | grep -q "RATCRAFT × CLOUVA"; then
              echo "Ratcraft visual shell is live on clouva.com.ar/minecraft"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Ratcraft screen was not detected on the public URL."
          exit 1

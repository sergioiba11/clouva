name: Center Home rail Player identity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/center-home-rail-player.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Center Player orbit identity in right rail
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("components/clouva/HomeDashboard.tsx")
          text = path.read_text(encoding="utf-8")

          old = 'className="flex w-full min-w-0 items-center gap-3 rounded-xl px-1 py-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400/70"'
          new = 'className="flex w-full min-w-0 flex-col items-center justify-center gap-1.5 rounded-xl px-1 py-2 text-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400/70"'
          if old not in text:
              raise SystemExit("Expected Home rail identity class was not found")
          text = text.replace(old, new, 1)

          old_copy = '<span className="min-w-0 leading-none">\n            <strong className="block truncate text-[11px] font-extrabold text-white">{displayName}</strong>\n            <small className="mt-1 block truncate text-[9px] font-medium text-violet-200/60">{username}</small>\n          </span>'
          new_copy = '<span className="w-full min-w-0 text-center leading-none">\n            <strong className="block truncate text-[11px] font-extrabold text-white">{displayName}</strong>\n            <small className="mt-1 block truncate text-[9px] font-medium text-violet-200/60">{username}</small>\n          </span>'
          if old_copy not in text:
              raise SystemExit("Expected Home rail identity copy was not found")
          text = text.replace(old_copy, new_copy, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit definitive Home rail alignment
        run: |
          rm .github/workflows/center-home-rail-player.yml
          git config user.name "Clouva"
          git config user.email "sergio.iba.11@gmail.com"
          git add components/clouva/HomeDashboard.tsx .github/workflows/center-home-rail-player.yml
          git commit -m "fix(home): center Player orbit identity in right rail"
          git push origin main

name: Patch Agenda draft persistence

on:
  push:
    branches:
      - work/agenda-draft-persistence
    paths:
      - .github/workflows/agenda-draft-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/agenda-draft-persistence
          fetch-depth: 0

      - name: Preserve Agenda composer across sibling routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/agenda/page.tsx")
          text = path.read_text()

          replacements = []

          old = 'const HOURS = Array.from({ length: 24 }, (_, hour) => hour);\n'
          new = old + 'const AGENDA_DRAFT_STORAGE_KEY = "clouva:agenda-draft:v1";\n'
          replacements.append((old, new, "storage key"))

          old = '  const [playerSearching, setPlayerSearching] = useState(false);\n  const [form, setForm] = useState(() => {'
          new = '  const [playerSearching, setPlayerSearching] = useState(false);\n  const [draftHydrated, setDraftHydrated] = useState(false);\n  const [form, setForm] = useState(() => {'
          replacements.append((old, new, "hydration state"))

          old = '''  });

  const active = useMemo(() => contexts.find((context) => context.agendaId === activeAgendaId) || contexts[0] || null, [activeAgendaId, contexts]);'''
          new = '''  });

  useEffect(() => {
    const saved = window.sessionStorage.getItem(AGENDA_DRAFT_STORAGE_KEY);
    if (saved) {
      try {
        const draft = JSON.parse(saved) as {
          activeAgendaId?: string;
          view?: ViewMode;
          cursor?: string;
          createOpen?: boolean;
          quickCreateDay?: string | null;
          quickHour?: number;
          quickShareOpen?: boolean;
          connectedPlayers?: PlayerResult[];
          selectedPlayers?: PlayerResult[];
          shareAgendaIds?: string[];
          playerQuery?: string;
          playerResults?: PlayerResult[];
          form?: typeof form;
        };

        if (typeof draft.activeAgendaId === "string") setActiveAgendaId(draft.activeAgendaId);
        if (draft.view && ["day", "week", "month", "list"].includes(draft.view)) setView(draft.view);
        if (draft.cursor) {
          const restoredCursor = new Date(draft.cursor);
          if (!Number.isNaN(restoredCursor.getTime())) setCursor(restoredCursor);
        }
        if (typeof draft.createOpen === "boolean") setCreateOpen(draft.createOpen);
        if (draft.quickCreateDay) {
          const restoredDay = new Date(draft.quickCreateDay);
          if (!Number.isNaN(restoredDay.getTime())) setQuickCreateDay(startOfDay(restoredDay));
        }
        if (typeof draft.quickHour === "number" && draft.quickHour >= 0 && draft.quickHour <= 23) setQuickHour(draft.quickHour);
        if (typeof draft.quickShareOpen === "boolean") setQuickShareOpen(draft.quickShareOpen);
        if (Array.isArray(draft.connectedPlayers)) setConnectedPlayers(draft.connectedPlayers);
        if (Array.isArray(draft.selectedPlayers)) setSelectedPlayers(draft.selectedPlayers);
        if (Array.isArray(draft.shareAgendaIds)) setShareAgendaIds(draft.shareAgendaIds);
        if (typeof draft.playerQuery === "string") setPlayerQuery(draft.playerQuery);
        if (Array.isArray(draft.playerResults)) setPlayerResults(draft.playerResults);
        if (draft.form) setForm(draft.form);
      } catch {
        window.sessionStorage.removeItem(AGENDA_DRAFT_STORAGE_KEY);
      }
    }
    setDraftHydrated(true);
  }, []);

  useEffect(() => {
    if (!draftHydrated) return;

    const hasDraft = Boolean(
      createOpen ||
      quickCreateDay ||
      form.title.trim() ||
      form.description.trim() ||
      selectedPlayers.length ||
      shareAgendaIds.length
    );

    if (!hasDraft) {
      window.sessionStorage.removeItem(AGENDA_DRAFT_STORAGE_KEY);
      return;
    }

    window.sessionStorage.setItem(AGENDA_DRAFT_STORAGE_KEY, JSON.stringify({
      activeAgendaId,
      view,
      cursor: cursor.toISOString(),
      createOpen,
      quickCreateDay: quickCreateDay?.toISOString() ?? null,
      quickHour,
      quickShareOpen,
      connectedPlayers,
      selectedPlayers,
      shareAgendaIds,
      playerQuery,
      playerResults,
      form,
    }));
  }, [
    activeAgendaId,
    connectedPlayers,
    createOpen,
    cursor,
    draftHydrated,
    form,
    playerQuery,
    playerResults,
    quickCreateDay,
    quickHour,
    quickShareOpen,
    selectedPlayers,
    shareAgendaIds,
    view,
  ]);

  const active = useMemo(() => contexts.find((context) => context.agendaId === activeAgendaId) || contexts[0] || null, [activeAgendaId, contexts]);'''
          replacements.append((old, new, "draft hydration and persistence"))

          old = '''      await readApiJson(response);
      setCreateOpen(false);
      setQuickCreateDay(null);'''
          new = '''      await readApiJson(response);
      window.sessionStorage.removeItem(AGENDA_DRAFT_STORAGE_KEY);
      setCreateOpen(false);
      setQuickCreateDay(null);'''
          replacements.append((old, new, "clear persisted draft after create"))

          for old, new, label in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f"Expected exactly one match for {label}, found {count}")
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Clouva"
          git config user.email "sergio.iba.11@gmail.com"
          git rm .github/workflows/agenda-draft-patch.yml
          git add app/agenda/page.tsx
          git commit -m "fix(agenda): preserve event draft across navigation"
          git push origin HEAD:work/agenda-draft-persistence

name: Agenda draft patch

on:
  push:
    branches: ["work/agenda-draft-persistence"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/agenda-draft-persistence
          fetch-depth: 0

      - name: Apply draft persistence patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Commit product change
        run: |
          git config user.name "Clouva"
          git config user.email "sergio.iba.11@gmail.com"
          git add app/agenda/page.tsx
          git commit -m "fix(agenda): preserve event draft across navigation"
          git push origin HEAD:work/agenda-draft-persistence
